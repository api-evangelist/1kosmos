openapi: 3.2.0
info:
  title: Admin Console API Documentation Public Keys APIs API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: Public Keys APIs
paths:
  /api/r1/community/{communityName}/publickeys:
    get:
      tags:
      - Public Keys APIs
      summary: Get public keys
      operationId: fetchPublicKeys
      parameters:
      - name: communityName
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
components:
  schemas:
    AuthBroker:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        publicKey:
          type: string
    PublicKeyResponse:
      type: object
      properties:
        publicKey:
          type: string
        authBroker:
          $ref: '#/components/schemas/AuthBroker'
        message:
          type: string
        otpSeed:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
