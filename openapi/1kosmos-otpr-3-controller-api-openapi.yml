tags:
- name: otpr-3-controller
paths:
  /api/r3/otp/verify:
    post:
      tags:
      - otpr-3-controller
      operationId: verifyOTPCode
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
      summary: Verify OTP code
      x-summary-source: derived
  /api/r3/otp/generate:
    post:
      tags:
      - otpr-3-controller
      operationId: generateNewOTPCode
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
      summary: Generate new OTP code
      x-summary-source: derived
