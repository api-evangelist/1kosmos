        name:
          type: string
        documents:
          type: string
        issuedDate:
          type: string
        expiryDate:
          type: string
        isRevoked:
          type: string
        updateReason:
          type: string
        jsonStr:
          type: string
        stdCredData:
          type: string
          writeOnly: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
