          type: string
        userId:
          type: string
        issuerId:
          type: string
        senderId:
          type: string
        updatedBy:
          type: string
        name:
          type: string
        documents:
          type: string
        issuedDate:
          type: string
        expiryDate:
          type: string
        isRevoked:
          type: string
        updateReason:
          type: string
        stdCredData:
          type: string
