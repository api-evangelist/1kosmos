tags:
- name: Cred APIs
paths:
  /api/r1/credentials/:
    put:
      tags:
      - Cred APIs
      operationId: createNewCredentials
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiableCredentialsRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VerifiableCredentials'
      summary: Create new credentials
      x-summary-source: derived
components:
  schemas:
    VerifiableCredentials:
      type: object
      properties:
        id:
