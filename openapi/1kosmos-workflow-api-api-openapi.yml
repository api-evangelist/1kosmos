  /workflowapi/workflow_instance/tenant/{tenantId}/community/{communityId}/create:
    post:
      operationId: workflowAPICreateWorkflowInstance
      summary: Create Workflow Instance
      tags:
      - Workflow API
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: communityId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              data: '{{enc_body_data}}'
      responses:
        '200':
          description: Workflow Instance
      x-postman-request: '{{wf_api}}/workflowapi/workflow_instance/tenant/:tenantId/community/:communityId/create'
      x-postman-variants:
      - Create Workflow Instance
  /workflowapi/workflow_instance/{wfInstanceId}/tenant/{tenantId}/community/{communityId}/node/{nodeId}:
    get:
      operationId: workflowAPINodeResult
      summary: Node Result
      tags:
      - Workflow API
      parameters:
      - name: wfInstanceId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: communityId
        in: path
        required: true
        schema:
          type: string
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Node Result
          content:
            application/json:
              schema:
                type: object
              example:
                data: 
                publicKey: 1hj9IXQjFVGsHidbo/9Uv7sd+eZjzy7Uq2643O2n+yd4XCnr9CWHIO3Kid7AvXMx5yOI+aeAtg1jfKxMkUhauQ==
                signature_token: aaddd1e69ba2c709a
      x-postman-request: '{{wf_api}}/workflowapi/workflow_instance/:wfInstanceId/tenant/:tenantId/community/:communityId/node/:nodeId'
      x-postman-variants:
