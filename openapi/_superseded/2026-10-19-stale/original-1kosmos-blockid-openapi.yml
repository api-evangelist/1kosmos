openapi: 3.1.0
info:
  title: 1Kosmos BlockID Platform API
  version: '2026-08-05'
  description: 'REST surface of the 1Kosmos BlockID identity platform — identity verification (IDVerify), identity
    assurance level (IAL) lookup, one-time passcodes, user management, access codes, W3C Verifiable Credentials
    and Verifiable Presentations, IAL2 identity-proofing workflows, and the reporting/metrics APIs.


    DERIVED, NOT PUBLISHED BY THE PROVIDER. 1Kosmos publishes no OpenAPI. This document was mechanically derived
    by API Evangelist from the first-party public Postman collection "1Kosmos Postman Collection" (https://documenter.getpostman.com/view/50203634/2sB3dHWZ1n),
    saved verbatim in this repo at postman/1kosmos-postman-collection.json. Every path, method, header, example
    request body and example response below is carried over from that collection; nothing was invented. Request/response
    schemas are typed only as generic objects because the collection carries examples, not schemas. Each operation
    records the original collection URL template in x-postman-request.'
  contact:
    name: 1Kosmos Developer Support
    email: developers@1kosmos.com
    url: https://developer.1kosmos.com/devportal/docs/
  x-generated-by: API Evangelist enrichment pipeline (derived from Postman collection)
  x-source: postman/1kosmos-postman-collection.json
servers:
- url: https://{tenantDNS}
  description: Tenant-scoped BlockID host. Every 1Kosmos deployment is addressed by its own tenant DNS name; the
    microservice hosts the collection references as {{client_api}}, {{wf_api}} and {{reports}} are discovered at
    runtime from GET /caas/sd on the tenant host.
  variables:
    tenantDNS:
      default: blockid-trial.1kosmos.net
      description: Your BlockID tenant DNS name as shown in the BlockID developer dashboard. blockid-trial.1kosmos.net
        is the trial tenant used throughout the published docs.
tags:
- name: Set up
- name: ID Verification
- name: IAL
- name: Reports
- name: OTP
- name: User Management
- name: Access Code
- name: Verifiable Credentials
- name: IAL2
- name: Workflow API
security:
- licenseKey: []
  publicKey: []
components:
  securitySchemes:
    licenseKey:
      type: apiKey
      in: header
      name: licensekey
      description: The tenant/community license key, ECDSA-encrypted with the shared secret derived from the caller
        private key and the community public key (see BIDECDSA in the first-party helper SDKs). Sent unencrypted
        only when the noecdsa header is set.
    publicKey:
      type: apiKey
      in: header
      name: publickey
      description: The caller ECDSA public key, used by the service to derive the shared secret that decrypts licensekey
        and encrypted payloads.
    tenantTag:
      type: apiKey
      in: header
      name: X-TenantTag
      description: Tenant tag, required by the reports, user-management and access-code services.
paths:
  /api/r1/system/community_info/fetch:
    post:
      operationId: setUpGetTenantCommunityInfo
      summary: Get Tenant Community Info
      description: 'This API is used to fetch the complete details of both the tenant and the community that were
        set as the environment variables.


        These details include configured tenant dns name and the list of other tenant DNS. Additionally, the community
        details include the logo URL used in the community, tenant tag, and so on. The logo details will be displayed
        only if you had set the skipLogos parameter in the payload to false.


        Mandatory Parmameters


        dns - Use the dns name of the tenant as a variable.


        communityName - Specify the community name as a variable.


        Optional Parameters

        skipLogos - This is a boolean parameter. Specifying this value as false displays the logo details in the
        response.'
      tags:
      - Set up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              dns: '{{tenantDNS}}'
              communityName: '{{community_name}}'
              skipLogos: false
      responses:
        '200':
          description: Tenant Community Info
          content:
            application/json:
              schema:
                type: object
              example:
                tenant:
                  id: 5f3d8d0cd********19cf968
                  firstname: Acme
                  lastname: Admin
                  tenanttype: master
                  tenanttag: acme
                  name: Acme
                  otherDNS:
                  - acme.1kosmos.net
                  - local.acme.net
                  - acme-console.1kosmos.com
                  - localblockid.com
                  - localhost
                  - acme-newconsole.example.com
                  - 73c4-**-**-67-119.ngrok.io
                  - acme-default.1kosmos.net
                  - acme-console
                  displayTenantInfoForPersona: true
                community:
                  id: 5f3d8d0cd********19cf969
                  tenantid: 5f3d8d0cd********19cf968
                  logo: iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAIAAAB7GkOtAAANIElEQVR4nOzXj7cXdH3HcS/cpW7hjiCbHYU8mUgjcQotdDonZzbF7FRza8M6WkscYrbjZE5SiqudHG55tGUmAbPhtGaKvw6SLo3DGjGFc/OQMMpq/AgwwAOxiSnur3id4zmvx+MPeL3vuef7Pc/vZ/CIP/zBYj
                  mobileLogo: ''
                  name: default
                  publicKey: dkW7xYymDr4Rh4wEGazMdtiDzaGQtzgfby7F/z1eJchUjebTmYxkKcW7cHAg12zFWYEeJF9erjwoKw0BOHqtYw==
                  accountsPerPerson: 12
                  personsPerAccount: 20
                  personLimitRule: reject
                  otpSeed: null
                message: null
      x-postman-request: https://{{tenantDNS}}/api/r1/system/community_info/fetch
      x-postman-variants:
      - Get Tenant Community Info
  /caas/sd:
    get:
      operationId: setUpFetchSD
      summary: Fetch SD
      description: This API is used to retrieve all microservices associated with your tenant. You must execute
        this API to know the URLs of each services. For example, if service A want to call service B, it is necessary
        for service A to know the URL for service B.
      tags:
      - Set up
      responses:
        '200':
          description: Successful response
      x-postman-request: https://{{tenantDNS}}/caas/sd
      x-postman-variants:
      - Fetch SD
  /document_share_session/create:
    post:
      operationId: idVerificationCreateIDVerificationSession
      summary: Create ID Verification Session
      description: "This API is used to create a session for a specific document type. You can generate a session\
        \ with one of the supported documents:\n\nidcard\n\ndriving license\n\npassport\n\nNote: The response displays\
        \ the generated session URL in the encrypted format. When you run this API in your postman, click the Visualization\
        \ tab in the response to view the result in the decrypted format. Otherwise, you can use your own helper\
        \ that is compatible with ECDSA to view the result in the decrypted format.\n\nAuthorization\nThis API is\
        \ using the license key to authorize the request.\n\nMandatory Parameters\ndata - Specify the dvcID, tenantDNS,\
        \ community name, and the type of document for which you want to create a verification session.\n\ndocumentType:\n\
        For Drivers License: set documentType: \"dl_object\"\nFor Passport: set documentType: \"ppt_object\"\nFor\
        \ Any other ID Card: set documentType: \"idcard_object\" \n\nNote: You must use your own tenant DNS and\
        \ community name.\n\nOptional Parameters\n\nusername - Specify the user for whom the session is created.\n\
        \nfirstname - Specify the first name of the user for whom the session is created.\n\nlastname - Specify\
        \ the last name of the user for whom the session is created.\n\nuid - A unique identifier which help in\
        \ mapping the session ID to the user performing the verification.\n\nView Sample Response\nPostman Responses"
      tags:
      - ID Verification
      parameters:
      - name: requestid
        in: header
        required: false
        schema:
          type: string
        description: This is a JSON string encrypted using ECDSA. It contains the fields such as "appid" (string),
          "uuid" (string), and "ts" (number), which represents the epoch timestamp in seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              data:
                dvcID: default dvcid
                sessionRequest:
                  tenantDNS: 1k-dev.1kosmos.net
                  communityName: default
                  documentType: idcard_object
                  user:
                    username: john.doe
                    lastname: doe
      responses:
        '200':
          description: 200 Success Response
          content:
            application/json:
              schema:
                type: object
              example:
                sessionId: e0833902-1741-4f25-a92e-516393112940
                url: https://acme.1kosmos.net/idproofing/session/e0833902-1741-4f25-a92e-516393112940
        '400':
          description: 400 Bad Response
          content:
            application/json:
              schema:
                type: object
              example:
                code: 400
                message: dvcID is required
      x-postman-request: /document_share_session/create
      x-postman-variants:
      - Create ID Verification Session
  /v3/document_share_session/result:
    post:
      operationId: idVerificationPollIDVerificationSession
      summary: Poll ID Verification Session
      description: 'The /result API displays the complete session details along with the verification status in
        the encrypted format.


        Note: To view the results in the decrypted format, click the Visualization tab in the response section when
        you run this API in your postman. Otherwise, you can use your own helper that is compatible with ECDSA to
        view the result in the decrypted format.


        Authorization

        This API is using the license key to authorize the request.


        Mandatory Parameters

        data - Specify the dvcID and sessionID which you would have received in the response of the create session
        API.


        Optional Parameters

        NA


        View Sample Response

        Postman Responses'
      tags:
      - ID Verification
      parameters:
      - name: requestid
        in: header
        required: false
        schema:
          type: string
        description: This is a JSON string encrypted using ECDSA. It contains the fields such as "appid" (string),
          "uuid" (string), and "ts" (number), which represents the epoch timestamp in seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              data:
                dvcID: tania_web_dvcid
                sessionId: 82f67f10-b4e4-4680-9970-5dfcc04ea39e
      responses:
        '200':
          description: 200 Success Response 1
          content:
            application/json:
              schema:
                type: object
              example:
                data: vlTj05byMjznI/UuAcQt8um1mlHPh4cvSabjsKOyPuYYaXimOUCHMSPKy6T/5rcsHu5CN7AmHbAseP2MA96I+1YOt0iSeFi/qneFAFJBy2i3XpefqkyO+M/bj0tusgHi48y59W7DiRs37d4=
                publicKey: 4tW63RBUPYX7Vo0pUUCbgacZd1kCbq18mbSKJskOFGqmegPjRqIZg5Z+3JJNQCDWCo0CMDI/RDke+cKyWKx2nw==
        '400':
          description: 400 Bad Response - DVCID cannot be empty
          content:
            application/json:
              schema:
                type: object
              example:
                code: 400
                message: dvcID is not allowed to be empty
      x-postman-request: /v3/document_share_session/result
      x-postman-variants:
      - Poll ID Verification Session
  /api/r1/community/{communityName}/userid/{userId}/ial:
    get:
      operationId: ialFetchIALOfAUser
      summary: Fetch IAL of a user
      description: "This API retrieves the Identity Assurance Level(s) of users based on their username. It also\
        \ shows the user's identity documents that were submitted as proof of identity. The API indicates whether\
        \ the user falls under the IAL1 or IAL2 category.\n\nNote: The proofs will only be displayed only if the\
        \ user's identity documents have been verified by certified third-party organizations such as AAMVA, IDRND,\
        \ and so on.\n\nPrerequisites:\n\nUsers are required to have at least one of the following documents enrolled\
        \ in their web wallet.\n\nDriving License\n\nPassport\n\nSSN\n\nYou must use the tenant DNS, public key\
        \ and private key specific to your organization. For more information, reach out to your 1Kosmos representative.\n\
        \nResponses:\n\n1Kosmos's API responses are encrypted using Elliptic Curve Digital Signature Agorithm (ECDSA)\
        \ to ensure secure data transmission. To view the responses in the decrypted format, you must use a helper\
        \ that is compatible with ECDSA.\n\nThis API generates the following types of responses:\n\nScenario 1:\n\
        \nIf the user has not enrolled any of their documents to the web wallet, their did value would be blank:\n\
        \nEncrypted Response\nDecrypted Response\n\nMmE2MzVhNjJlNGQyMzQzMrODkyiatZgbfMl3dDOyaosXLRLeSMyiFyDwpOYVEWMxsb1pFcYJBWj33dzzK8z95DDr+Vbum7Bq8ctfObpyGadBcK+aPfS2YNKxpeAkIhu9AktSGIUHA2KM5wPZB+aDisFQ+vhB2YtOdjrc3R+wshZZzOAgWD5amhHkb7/5mAhUO9dMJ7QTJVaGh1U1y7KQ\n\
        {  \n\"user\": {  \n\"authModuleId\": \"6087371a80abe60013fb30b5\",  \n\"uid\": \"30620813-265f-4386-be49-26aa3af330f7\"\
        ,  \n\"username\": \"jondoe\"  \n},  \n\"did\": {}  \n}\n\nScenario 2:\n\nIf the user is IAL1 certified,\
        \ the did displays its value and the assurance level of the user.\n\nNote: The proofs will only be displayed\
        \ in the response if the user's identity documents have been verified by certified third-party organizations\
        \ such as AAMVA.\n\nEncrypted Response\nDecrypted Response\n\n\"\"\
        \  \n}\n{  \n\"user\": {  \n\"authModuleId\": \"6087371a80abe60013fb30b5\",  \n\"uid\": \"e855ddfd-7ef0-4d34-8fad-d5b919059619\"\
        ,  \n\"username\": \"john\"  \n},  \n\"did\": {  \n\"ab78ea7df3a4b2fbb2b37fa60b08204ca6e701db\": {  \n\"\
        value\": \"IAL1\",  \n\"proofs\": []  \n}  \n}  \n}\n\nScenario 3:\n\nIf the user is IAL2 certified, the\
        \ DID will display its value along with the assurance level and the proof that was verified to obtain IAL2\
        \ certification.\n\nEncrypted Response\nDecrypted Response\n\n\"\"\
        \n{  \n\"user\": {  \n\"authModuleId\": \"6087371a80abe60013fb30b5\",  \n\"uid\": \"c3f4ef6a-8a3e-478b-a01c-eba38d2a5427\"\
        ,  \n\"username\": \"bhargavi\"  \n},  \n\"did\": {  \n\"94adb4156f52329548de4a3c6ede5a89d140bcc6\": { \
        \ \n\"value\": \"IAL2\",  \n\"proofs\": [  \n{  \n\"type\": \"ssn_affidavit\",  \n\"proof\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..A07aCM2zWxo8f1VQlIxV49O9MWbRYWUOqaCD2xUvmI8\"\
        \  \n},  \n{  \n\"type\": \"dl_affidavit\",  \n\"proof\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..wz7EUaO1HVk9kYh9UNn4wcJG9zpT2mu9y78xOW1d4Ts\"\
        \  \n}  \n]  \n}  \n}  \n}\n\nSample Response Parameters:\n\nThe following table provides the sample response\
        \ parameters:\n\nParameter\nDescription\n\nauthModuleID\n\nuid\nUnique Identifier\n\nusername\nName of the\
        \ user\n\ndid\ndid of the wallet\n\nvalue\nDisplays whether the user belongs to IAL1 or IAL2 category.\n\
        \nproofs\nType of document present in the wallet."
      tags:
      - IAL
      parameters:
      - name: communityName
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      - name: tenant_name
        in: header
        required: false
        schema:
          type: string
      - name: community_name
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: IAL2 with proofs
          content:
            application/json:
              schema:
                type: object
              example:
                data: 
      x-postman-request: '{{tenantDNS}}/api/r1/community/{{community_name}}/userid/johndoe/ial'
      x-postman-variants:
      - Fetch IAL of a user
  /reports/tenant/{tenantID}/community/{communityID}/events:
    post:
      operationId: reportsEvents
      summary: Events
      description: "API Request Description\nThis endpoint allows you to retrieve event data for a specific community\
        \ within a tenant.\n\nRequest URL\nPOST {{client_api}}/reports/tenant/:tenantID/community/:communityID/events\n\
        \nRequest Parameters\n\npSize (integer): The number of records to return per page. In the example, it is\
        \ set to 10.\n\npIndex (integer): The page index for pagination. In the example, it is set to 1.\n\nfrom\
        \ (string): The start date and time for the events to be retrieved, formatted as YYYY-MM-DD HH:MM:SS.SSS.\
        \ In the example, it is 2025-05-01 00:00:00.000.\n\nto (string): The end date and time for the events to\
        \ be retrieved, formatted as YYYY-MM-DD HH:MM:SS.SSS. In the example, it is 2025-05-10 00:00:00.000.\n\n\
        query (object): An object containing the search criteria for the events. In the example, it includes:\n\n\
        event_name (string): The name of the event to filter by. In the example, it is set to \"E_IDV_DOCUMENT_VALIDATE\"\
        .\n\nExpected Response\n\nStatus Code: 200 OK\n\nContent-Type: application/json\n\nResponse Body:\n\npage\
        \ (object): Contains pagination information.\n\ntotal (integer): Total number of records available.\n\n\
        pSize (integer): The size of the current page.\n\npIndex (integer): The current page index.\n\ndata (array):\
        \ An array of event data objects. If no events are found, this will be an empty array.\n\nExample Response\n\
        {\n  \"page\": {\n    \"total\": 0,\n    \"pSize\": 0,\n    \"pIndex\": 0\n  },\n  \"data\": []\n}\n\nNotes\n\
        \nEnsure that you provide valid tenantID and communityID in the URL.\n\nThe request requires authorization\
        \ headers which must be included for successful execution.\n\nThe response may vary based on the provided\
        \ date range and query parameters."
      tags:
      - Reports
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: communityID
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              pSize: 10
              pIndex: 1
              from: '2025-05-01 00:00:00.000'
              to: '2025-05-10 00:00:00.000'
              query:
                event_name: E_IDV_DOCUMENT_VALIDATE
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                page:
                  total: 0
                  pSize: 10
                  pIndex: 1
                data: []
        '400':
          description: Incorrect From-To Dates
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - message: Field should be from current time to minus 90 days
                  param: from
                - message: Date 'to' must be after or equal to 'from'
                  param: to
      x-postman-request: '{{client_api}}/reports/tenant/:tenantID/community/:communityID/events'
      x-postman-variants:
      - Events
  /reports/tenant/{tenantID}/community/{communityID}/metrics:
    post:
      operationId: reportsMetrics
      summary: Metrics
      description: "Request Description\nThis API endpoint is used to submit metrics data for a specific community\
        \ within a tenant. The purpose of this request is to track and analyze various metrics related to community\
        \ activities.\n\nRequest Parameters\nThe request must include a JSON body with the following parameters:\n\
        \nmetricsName (string): The name of the metric you want to report (e.g., \"M_GT_SUCCESSFUL_AUTHENTICATION\"\
        ).\n\nfrom (string): The start date and time for the metric data in the format YYYY-MM-DD HH:MM:SS.sss.\n\
        \nto (string): The end date and time for the metric data in the format YYYY-MM-DD HH:MM:SS.sss.\n\nResponse\
        \ Structure\nThe API responds with a JSON object containing the following field:\n\ncount (integer): The\
        \ number of records that match the provided metrics criteria. For example, a response of {\"count\":0} indicates\
        \ that there were no records found for the specified metrics within the given date range.\n\nExample Request\n\
        {\n  \"metricsName\": \"M_GT_SUCCESSFUL_AUTHENTICATION\",\n  \"from\": \"2025-05-01 00:00:00.000\",\n  \"\
        to\": \"2025-05-01 00:00:00.000\"\n}\n\nExample Response\n{\n  \"count\": 0\n}"
      tags:
      - Reports
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: communityID
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              metricsName: M_GT_SUCCESSFUL_AUTHENTICATIONS
              from: '2025-05-01 00:00:00.000'
              to: '2025-05-01 00:00:00.000'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                count: 172
        '400':
          description: Bad/Missing License Key
          content:
            application/json:
              schema:
                type: object
              example:
                errors:
                - message: This header can't be decrypted
                  param: licensekey
      x-postman-request: '{{client_api}}/reports/tenant/:tenantID/community/:communityID/metrics'
      x-postman-variants:
      - Metrics
  /reports/tenant/{tenantID}/community/{communityID}/application_usage_report:
    post:
      operationId: reportsApplicationUsageReport
      summary: Application Usage Report
      description: "Request Description\nThis API endpoint allows you to generate an application usage report for\
        \ a specific tenant and community within the client application.\n\nRequest Method\n\nPOST\n\nRequest URL\n\
        \n{{client_api}}/reports/tenant/:tenantID/community/:communityID/application_usage_report\n\nRequest Body\n\
        The request body must be in JSON format and should contain the following parameters:\n\nfrom (string): The\
        \ start date and time for the report in the format YYYY-MM-DD HH:mm:ss.SSS.\n\nto (string): The end date\
        \ and time for the report in the format YYYY-MM-DD HH:mm:ss.SSS.\n\npSize (integer): The number of records\
        \ to return per page.\n\npIndex (integer): The index of the page to return.\n\nExample Payload:\n\n{\n \
        \ \"from\": \"2025-05-01 00:00:00.000\",\n  \"to\": \"2026-06-01 00:00:00.000\",\n  \"pSize\": 10,\n  \"\
        pIndex\": 0\n}\n\nExpected Response\nThe response will be a JSON object containing:\n\npage: An object with\
        \ pagination details.\n\ntotal (integer): The total number of records available.\n\npSize (integer): The\
        \ number of records per page.\n\npIndex (integer): The current page index.\n\ndata: An array of objects\
        \ representing the application usage events. Each object may include fields such as:\n\nevent_name (string):\
        \ The name of the event.\n\nevent_ts (integer): The timestamp of the event.\n\nuser_id (string): The ID\
        \ of the user associated with the event.\n\nAdditional fields related to the event and user details.\n\n\
        Example Response:\n\n{\n  \"page\": {\n    \"total\": 0,\n    \"pSize\": 0,\n    \"pIndex\": 0\n  },\n \
        \ \"data\": []\n}\n\nNotes\n\nEnsure that the tenantID and communityID in the URL are replaced with valid\
        \ identifiers.\n\nThe request requires appropriate authorization headers to be included.\n\nThe response\
        \ may vary based on the data available for the specified time range."
      tags:
      - Reports
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: communityID
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              from: '2025-05-01 00:00:00.000'
              to: '2026-06-01 00:00:00.000'
              pSize: 10
              pIndex: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                page:
                  total: 4
                  pSize: 10
                  pIndex: 0
                data:
                - event_name: E_SP_REDIRECT_SUCCEEDED
