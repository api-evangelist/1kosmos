      operationId: otpVerifyOTPR3
      summary: Verify OTP R3
      description: "Verify OTP Standardized Endpoint\nThis endpoint is used to verify a One-Time Password (OTP)\
        \ submitted by a user during the authentication process. It ensures that the provided OTP corresponds to\
        \ the user and is valid for the specified community and tenant with standardized success & error responses.\n\
        \nRequest\nMethod: POST\nURL: {{client_api}}/api/r3/otp/verify\n\nRequest Body Parameters\nThe request body\
        \ must be sent in JSON format and should include the following parameters:\n\nField Name\nRequired Field\n\
        Type\nDescription\n\ncode\nYes\nstring\nThe OTP code that the user has received and is attempting to verify.\n\
        \nuserId\nYes\nstring\nThe same unique identifier used to generate the OTP.\n\nuserPublicKey\nNo\nstring\n\
        The public key associated with the user, used for cryptographic verification.\n\ncommunityId\nYes\nstring\n\
        The identifier for the community to which the user belongs.\n\ntenantId\nYes\nstring\nThe identifier for\
        \ the tenant associated with the community.\n\nserviceName\nNo\nstring\nName of the service for which OTP\
        \ is being verified\n\nResponse\nThe response will be returned in JSON format. The structure of the response\
        \ may include:\n\nField Name\nType\nDescription\n\nerror_code\ninteger\nA code representing the status of\
        \ the request. A value of 0 typically indicates no error.\n\nerror_message\nstring\nA message providing\
        \ additional information about the request status. This may be empty or contain relevant info.\n\nmessage\n\
