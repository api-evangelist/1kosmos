  /reports/tenant/{tenantID}/community/{communityID}/last_seen_report:
    post:
      operationId: reportsLastSeenReport
      summary: Last Seen Report
      description: "Request Description\nThis is a POST request to retrieve the last seen report for a specific\
        \ user in a community.\n\nEndpoint:\n\n{{client_api}}/reports/tenant/:tenantID/community/:communityID/last_seen_report\n\
        \nRequest Body:\nThe request requires a JSON payload with the following parameters:\n\nuser_id (string):\
        \ The unique identifier for the user.\n\ndevice_id (string): The unique identifier for the device used by\
        \ the user.\n\neventName (string): The name of the event being reported (e.g., login success).\n\nExample\
        \ Request Body:\n\n{\n  \"user_id\": \"rahulauth\",\n  \"device_id\": \"4991d8a02a256d0e\",\n  \"eventName\"\
        : \"E_LOGIN_SUCCEEDED\"\n}\n\nExpected Response:\nThe response will return a JSON object containing an array\
        \ of data with the following fields:\n\ndata (array): An array of event records, each containing:\n\ntype\
        \ (string): Type of the event.\n\nevent_ts (integer): Timestamp of the event.\n\nversion (string): Version\
        \ of the event.\n\njourney_id (string): Identifier for the journey.\n\nsession_id (string): Identifier for\
        \ the session.\n\nclient_ip_address (string): IP address of the client.\n\ncaller_user_agent (string): User\
        \ agent of the caller.\n\nlogin_state (string): Current login state of the user.\n\nuser_id (string): User\
        \ identifier.\n\nuser_status (string): Status of the user.\n\nuser_email (string): Email of the user.\n\n\
        user_firstname (string): First name of the user.\n\nuser_lastname (string): Last name of the user.\n\nsource_user_directory\
