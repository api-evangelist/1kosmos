  /vcs/tenant/{tenantID}/community/{communityID}/vc/from/payload/{vcType}:
    post:
      operationId: verifiableCredentialsCreateVerifiableCredentialFromPayload
      summary: Create  Verifiable Credential From Payload
      description: "API Endpoint: Create Verifiable Credential\nThis endpoint allows you to create a Verifiable\
        \ Credential (VC) for a specified tenant and community. It utilizes the HTTP POST method to submit a payload\
        \ containing user information and related details.\n\nRequest\n\nMethod: POST\n\nEndpoint: {{client_api}}/vcs/tenant/:tenantID/community/:communityID/vc/from/payload/:vcType\n\
        \nURL Parameters\n\ntenantID (string): The unique identifier for the tenant.\n\ncommunityID (string): The\
        \ unique identifier for the community.\n\nvcType (string): The type of verifiable credential being created.\n\
        \nRequest Body\nThe request body must be in JSON format and should contain the following keys:\n\nRequest\
        \ Body Schema\n\nKey\nType\nRequired\nDescription\n\ninfo\nobject\nYes\nContains user and company information\n\
        \n└── id\nstring\nYes\nUnique identifier\n\n└── firstName\nstring\nYes\nUser's first name\n\n└── lastName\n\
        string\nYes\nUser's last name\n\n└── companyName\nstring\nYes\nName of the company\n\n└── companyAddress\n\
        string\nYes\nCompany address\n\n└── department\nstring\nNo\nDepartment name\n\n└── title\nstring\nNo\nJob\
        \ title\n\n└── doe\nstring\nYes\nDate of employment (format: yyyymmdd)\n\n└── xx\nstring / number / boolean\n\
        No\nFlexible field\n\ndid\nstring\nYes\nDecentralized Identifier\n\npublicKey\nstring\nYes\nPublic key associated\
        \ with the DID\n\nissuer\nobject\nYes\nContains issuer details\n\n└── id\nstring\nYes\nIssuer ID\n\n└──\
        \ xx\nstring\nNo\nOptional field\n\nuserURN\nstring\nNo\nUser's URN\n\nissueVP\nboolean\nYes\nWhether to\
        \ issue a verifiable presentation\n\nvpRequest\nobject\nYes\nVerifiable Presentation request configuration\n\
        \n└── attributes\narray of strings\nNo\nAttributes requested in VP\n\n└── ageToProve\nnumber\nNo\nMinimum\
        \ age required\n\n└── createShareUrl\nboolean\nYes\nWhether to generate a shareable URL\n\nResponse\nOn\
        \ a successful request, the API will return a response with the following structure:\n\nStatus Code: 200\n\
        \nContent-Type: application/json\n\nError Response\n\nHTTP Status\nError Message\nDescription\n\n400\nThis\
        \ userId or userPublicKey is mandatory\nRequest payload without user info\n\n400\nUnable to load tenant/community\n\
        Wrong community ID or tenant ID\n\n400\nInvalid Payload\nInvalid/Missing Payload\n\n401\nInvalid License\
        \ Key\nEntered License is invalid\n\nResponse Body\nThe response will include the following keys:\n\nvc\
        \ (object): The created Verifiable Credential.\n\n@context (array): Context information for the VC.\n\n\
        id (string): Identifier for the VC.\n\ntype (array): Types associated with the VC.\n\nissuer (object): Issuer\
        \ details.\n\nid (string): Issuer identifier.\n\ntenantId (string): Tenant identifier.\n\ncommunityId (string):\
        \ Community identifier.\n\nissuanceDate (string): Date the VC was issued.\n\nexpirationDate (string): Expiration\
        \ date of the VC.\n\ncredentialSubject (object): Subject information of the VC.\n\nid (string): Subject\
        \ identifier.\n\nOther personal information fields as provided in the request.\n\nproof (object): Proof\
        \ details for the VC.\n\ntype (string): Type of proof.\n\ncreated (string): Creation date of the proof.\n\
        \nverificationMethod (string): Method used for verification.\n\nproofPurpose (string): Purpose of the proof.\n\
