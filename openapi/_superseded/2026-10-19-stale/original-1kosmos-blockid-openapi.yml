    post:
      operationId: reportsAuditLogReport
      summary: Audit Log Report
      description: "Request Description\nThis is a POST request to retrieve the audit log for a specific community\
        \ within a tenant.\n\nEndpoint:\n\n{{client_api}}/reports/tenant/:tenantID/community/:communityID/audit_log\n\
        \nRequest Body:\nThe request body should be in JSON format and include the following parameters:\n\npSize\
        \ (integer): The number of records to return per page.\n\npIndex (integer): The index of the page to retrieve.\n\
        \nfrom (string): The start date and time for the audit log in the format YYYY-MM-DD HH:MM:SS.SSS.\n\nto\
        \ (string): The end date and time for the audit log in the format YYYY-MM-DD HH:MM:SS.SSS.\n\nExample Request\
        \ Body:\n\n{\n  \"pSize\": 5,\n  \"pIndex\": 0,\n  \"from\": \"2025-05-01 00:00:00.000\",\n  \"to\": \"\
        2026-06-01 00:00:00.000\"\n}\n\nExpected Response:\nThe response will be in JSON format and will contain\
        \ the following structure:\n\npage: An object containing pagination information.\n\ntotal (integer): The\
        \ total number of records available.\n\npSize (integer): The number of records returned per page.\n\npIndex\
        \ (integer): The current page index.\n\ndata: An object containing the audit log events.\n\nauditLogEvents\
        \ (array): A list of audit log events, where each event includes:\n\nevent_name (string): The name of the\
        \ event.\n\nevent_ts (integer): The timestamp of the event.\n\ntenant_id (string): The ID of the tenant.\n\
        \ncommunity_id (string): The ID of the community.\n\neventCategory (string): The category of the event.\n\
        \ntype (string): The type of the event.\n\nsp_type (string): The service provider type.\n\nsp_name (string):\
        \ The name of the service provider.\n\nsp_id (string): The ID of the service provider.\n\nold_authRequestSignRequired\
        \ (boolean): Indicates if the old auth request sign is required.\n\nnew_authRequestSignRequired (boolean):\
        \ Indicates if the new auth request sign is required.\n\nnew_encryptAssertion (boolean): Indicates if the\
        \ new encrypt assertion is enabled.\n\nnew_encryptionAlgorithm (string): The new encryption algorithm used.\n\
        \nnew_keyTransportAlgorithm (string): The new key transport algorithm used.\n\nuser_id (string): The ID\
        \ of the user associated with the event.\n\nuser_name (string): The name of the user associated with the\
        \ event.\n\nconnection_ip_address (string): The IP address from which the connection was made.\n\nconnection_useragent\
        \ (string): The user agent string of the connection.\n\nevent_id (string): The unique identifier for the\
        \ event.\n\ntimestamp (string): The timestamp of the event.\n\nepoch_time (string): The epoch time of the\
        \ event.\n\neventName (string): The name of the event.\n\nNotes:\n\nEnsure that the request headers include\
        \ the necessary authorization tokens and keys.\n\nThe from and to parameters should be carefully set to\
        \ ensure they fall within the range of available audit logs."
