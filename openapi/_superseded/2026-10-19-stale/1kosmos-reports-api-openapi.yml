  /reports/tenant/{tenantID}/community/{communityID}/login_activity_report:
    post:
      operationId: reportsLoginActivityReport
      summary: Login Activity Report
      description: 'Request Description

        This is an HTTP POST request to the endpoint {{client_api}}/reports/tenant/:tenantID/community/:communityID/login_activity_report.


        Request Parameters

        The request body should be in JSON format and includes the following parameters:


        pSize (integer): The number of records to return per page.


        pIndex (integer): The page index for pagination.


        from (string): The start date and time for the report in the format YYYY-MM-DD HH:mm:ss.SSS.


        to (string): The end date and time for the report in the format YYYY-MM-DD HH:mm:ss.SSS.


        eventName (string): The name of the event to filter the report.


        Example Request Body

        {

        "pSize": 10,

        "pIndex": 0,

        "from": "2025-05-01 00:00:00.000",

        "to": "2026-06-01 00:00:00.000",

        "eventName": "E_SP_REDIRECT_SUCCEEDED"

        }


        Expected Response Format

        The response will be in JSON format and will include the following structure:


        page: An object containing pagination details.


        total (integer): Total number of records available.


        pSize (integer): The size of the page.


        pIndex (integer): The current page index.


        data: An object containing the activity and login events.


        activityEvents: An array of objects representing activity events, each with various attributes including event_name, event_ts, user_id, etc.


        loginEvents: An array of objects representing login events, each with attributes including type, event_ts, user_id, etc.


        This request is designed to retrieve login activity reports for a specified tenant and community within a defined date range.'
      tags:
      - Reports
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
