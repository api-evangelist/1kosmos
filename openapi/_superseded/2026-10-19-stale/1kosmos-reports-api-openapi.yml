  /reports/tenant/{tenantID}/community/{communityID}/audit_log:
    post:
      operationId: reportsAuditLogReport
      summary: Audit Log Report
      description: 'Request Description

        This is a POST request to retrieve the audit log for a specific community within a tenant.


        Endpoint:


        {{client_api}}/reports/tenant/:tenantID/community/:communityID/audit_log


        Request Body:

        The request body should be in JSON format and include the following parameters:


        pSize (integer): The number of records to return per page.


        pIndex (integer): The index of the page to retrieve.


        from (string): The start date and time for the audit log in the format YYYY-MM-DD HH:MM:SS.SSS.


        to (string): The end date and time for the audit log in the format YYYY-MM-DD HH:MM:SS.SSS.


        Example Request Body:


        {

        "pSize": 5,

        "pIndex": 0,

        "from": "2025-05-01 00:00:00.000",

        "to": "2026-06-01 00:00:00.000"

        }


        Expected Response:

        The response will be in JSON format and will contain the following structure:


        page: An object containing pagination information.


        total (integer): The total number of records available.


        pSize (integer): The number of records returned per page.


        pIndex (integer): The current page index.


        data: An object containing the audit log events.


        auditLogEvents (array): A list of audit log events, where each event includes:


        event_name (string): The name of the event.


        event_ts (integer): The timestamp of the event.


        tenant_id (string): The ID of the tenant.


        community_id (string): The ID of the community.


        eventCategory (string): The category of the event.


        type (string): The type of the event.


        sp_type (string): The service provider type.


        sp_name (string): The name of the service provider.


        sp_id (string): The ID of the service provider.


        old_authRequestSignRequired (boolean): Indicates if the old auth request sign is required.


        new_authRequestSignRequired (boolean): Indicates if the new auth request sign is required.


        new_encryptAssertion (boolean): Indicates if the new encrypt assertion is enabled.


        new_encryptionAlgorithm (string): The new encryption algorithm used.


        new_keyTransportAlgorithm (string): The new key transport algorithm used.


        user_id (string): The ID of the user associated with the event.


        user_name (string): The name of the user associated with the event.


        connection_ip_address (string): The IP address from which the connection was made.


        connection_useragent (string): The user agent string of the connection.


        event_id (string): The unique identifier for the event.


        timestamp (string): The timestamp of the event.


        epoch_time (string): The epoch time of the event.


        eventName (string): The name of the event.


        Notes:


        Ensure that the request headers include the necessary authorization tokens and keys.


        The from and to parameters should be carefully set to ensure they fall within the range of available audit logs.'
      tags:
      - Reports
      parameters:
      - name: tenantID
        in: path
        required: true
        schema:
          type: string
      - name: communityID
        in: path
        required: true
        schema:
          type: string
      - name: requestid
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              pSize: 5
              pIndex: 0
              from: '2025-05-01 00:00:00.000'
              to: '2026-06-01 00:00:00.000'
