              $ref: '#/components/schemas/TenantCommunityRequestObject'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    ServiceKeysRequestObject:
      type: object
      properties:
        dns:
          type: string
        tenantId:
          type: string
        communityName:
          type: string
        communityId:
          type: string
        skipLogos:
          type: boolean
        otpSeed:
          type: boolean
        keyTag:
          type: string
    InstallRequest:
      type: object
      properties:
        tenantName:
          type: string
        tenantDNS:
          type: string
        tenantTag:
          type: string
        contactFname:
          type: string
        contactLname:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        tenantPassword:
          type: string
        emailGateway:
          $ref: '#/components/schemas/MSGGateway'
        smsGateway:
          $ref: '#/components/schemas/MSGGateway'
        analytics:
          $ref: '#/components/schemas/Analytics'
    Analytics:
      type: object
      properties:
        elastic:
          $ref: '#/components/schemas/Elastic'
    MSGGateway:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        username:
          type: string
        password:
          type: string
        serviceUrl:
          type: string
        channels:
          type: array
          items:
            type: string
        senderPhone:
          type: string
        senderEmail:
          type: string
        active:
          type: boolean
        timeoutValue:
          type: integer
          format: int32
        auth:
          type: string
        authTokenRequestUrl:
          type: string
        authClientId:
          type: string
        authClientSecret:
          type: string
        authGrantType:
          type: string
        authScope:
          type: string
        protocol:
          type: string
        port:
          type: string
        tlsVersion:
          type: string
        isdcode:
          type: string
        smsServiceNumber:
          type: string
        smstemplateid:
          type: string
        otpDelimiter:
          type: string
        communityId:
          type: string
        tenantId:
          type: string
        groupName:
          type: string
        entityId:
          type: string
        ivrEntityId:
          type: string
        otpTemplateId:
          type: string
        otpTemplateB64:
          type: string
        awsRegion:
          type: string
        gstFlag:
          type: string
        msgType:
          type: string
        appCategory:
          type: string
        eventData:
          type: object
          additionalProperties: {}
          writeOnly: true
        valid:
          type: boolean
        idTS:
          type: integer
          format: int32
    TenantCommunityRequestObject:
      type: object
      properties:
        dns:
          type: string
        tenantId:
          type: string
        communityName:
          type: string
        communityId:
          type: string
        skipLogos:
          type: boolean
        otpSeed:
          type: boolean
    CreateCommunityRequest:
      type: object
      properties:
        communityName:
          type: string
        emailGateway:
          $ref: '#/components/schemas/MSGGateway'
        smsGateway:
          $ref: '#/components/schemas/MSGGateway'
    Elastic:
      type: object
      properties:
        url:
          type: string
        uid:
          type: string
        pwd:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
