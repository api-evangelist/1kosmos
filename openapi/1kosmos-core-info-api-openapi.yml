  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: Core Info
paths:
  /api/r1/system/servicekeys/{keyId}/authorize:
    post:
      tags:
      - Core Info
      summary: Authorize by serivce key
      description: This endpoint authorize by service key. The license you are using must be of authLevel 'system' or 'service'
      operationId: authorizeByServiceKey
      parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceKeysRequestObject'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/servicekeys/fetch:
    post:
      tags:
      - Core Info
      summary: Fetch Service keys
      description: This endpoint returns available service keys. The license you are using must be of authLevel 'system'
      operationId: fetchServiceKeys
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCommunityRequestObject'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/ledger_info/fetch:
    post:
      tags:
      - Core Info
      summary: Fetch ledger configuration
      operationId: fetchLedgerInfo
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCommunityRequestObject'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/install:
    post:
      tags:
      - Core Info
      summary: Install Product
      operationId: installProduct
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/create/community:
    post:
      tags:
      - Core Info
      summary: Create Community
      operationId: createCommunity
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
