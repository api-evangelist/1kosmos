        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/servicekeys/{keyId}:
    delete:
      tags:
      - Core Info
      summary: Delete a Service key
      description: This endpoint resets service key for given keyId. Deletes current one and recreates a new one. The license you are using must be of authLevel 'system'
      operationId: deleteServiceKey
      parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
