        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r1/system/analytics_info/fetch:
    post:
      tags:
      - Core Info
      summary: Fetch analytics configuration
      operationId: fetchAnalyticsInfo
      parameters:
      - name: publickey
        in: header
