openapi: 3.2.0
info:
  title: 1Kosmos BlockID Platform Verifiable Credentials API
  version: '2026-08-05'
  description: REST surface of the 1Kosmos BlockID identity platform — identity verification (IDVerify), identity assurance level (IAL) lookup, one-time passcodes, user management, access codes, W3C Verifiable Credentials and Verifiable Presentations, IAL2 identity-proofing workflows, and the reporting/metrics APIs.
  contact:
    name: 1Kosmos Developer Support
    email: developers@1kosmos.com
    url: https://developer.1kosmos.com/devportal/docs/
  x-generated-by: API Evangelist enrichment pipeline (derived from Postman collection)
  x-source: postman/1kosmos-postman-collection.json
servers:
- url: https://{tenantDNS}
  description: Tenant-scoped BlockID host. Every 1Kosmos deployment is addressed by its own tenant DNS name; the microservice hosts the collection references as {{client_api}}, {{wf_api}} and {{reports}} are discovered at runtime from GET /caas/sd on the tenant host.
  variables:
    tenantDNS:
      default: blockid-trial.1kosmos.net
      description: Your BlockID tenant DNS name as shown in the BlockID developer dashboard. blockid-trial.1kosmos.net is the trial tenant used throughout the published docs.
security:
- licenseKey: []
  publicKey: []
tags:
- name: Verifiable Credentials
paths:
  /vcs/tenant/{tenantID}/community/{communityID}/vc/from/payload/{vcType}:
    post:
      operationId: verifiableCredentialsCreateVerifiableCredentialFromPayload
      summary: Create Verifiable Credential From Payload
      description: 'API Endpoint: Create Verifiable Credential

        This endpoint allows you to create a Verifiable Credential (VC) for a specified tenant and community. It utilizes the HTTP POST method to submit a payload containing user information and related details.


        Request


        Method: POST


        Endpoint: {{client_api}}/vcs/tenant/:tenantID/community/:communityID/vc/from/payload/:vcType


        URL Parameters


        tenantID (string): The unique identifier for the tenant.


        communityID (string): The unique identifier for the community.


        vcType (string): The type of verifiable credential being created.


        Request Body

        The request body must be in JSON format and should contain the following keys:


        Request Body Schema


        Key

        Type

        Required

        Description


        info

        object

        Yes

        Contains user and company information


        └── id

        string

        Yes

        Unique identifier


        └── firstName

        string

        Yes

        User''s first name


        └── lastName

        string

        Yes

        User''s last name


        └── companyName

        string

        Yes

        Name of the company


        └── companyAddress

        string

        Yes

        Company address


        └── department

        string

        No

        Department name


        └── title

        string

        No

        Job title


        └── doe

        string

        Yes

        Date of employment (format: yyyymmdd)


        └── xx

        string / number / boolean

        No

        Flexible field


        did

        string

        Yes

        Decentralized Identifier


        publicKey

        string

        Yes

        Public key associated with the DID


        issuer

        object

        Yes

        Contains issuer details


        └── id

        string

        Yes

        Issuer ID


        └── xx

        string

        No

        Optional field


        userURN

        string

        No

        User''s URN


        issueVP

        boolean

        Yes

        Whether to issue a verifiable presentation


        vpRequest

        object

        Yes

        Verifiable Presentation request configuration


        └── attributes

        array of strings

        No

        Attributes requested in VP


        └── ageToProve

        number

        No

        Minimum age required


        └── createShareUrl

        boolean

        Yes

        Whether to generate a shareable URL


        Response

        On a successful request, the API will return a response with the following structure:


        Status Code: 200


        Content-Type: application/json


        Error Response


        HTTP Status

        Error Message

        Description


        400

        This userId or userPublicKey is mandatory

        Request payload without user info


        400

        Unable to load tenant/community

        Wrong community ID or tenant ID


        400

        Invalid Payload

        Invalid/Missing Payload


        401

        Invalid License Key

        Entered License is invalid


        Response Body

        The response will include the following keys:


        vc (object): The created Verifiable Credential.


        @context (array): Context information for the VC.


        id (string): Identifier for the VC.


        type (array): Types associated with the VC.


        issuer (object): Issuer details.


        id (string): Issuer identifier.


        tenantId (string): Tenant identifier.


        communityId (string): Community identifier.


        issuanceDate (string): Date the VC was issued.


        expirationDate (string): Expiration date of the VC.


        credentialSubject (object): Subject information of the VC.


        id (string): Subject identifier.


        Other personal information fields as provided in the request.


        proof (object): Proof details for the VC.


        type (string): Type of proof.


        created (string): Creation date of the proof.


        verificationMethod (string): Method used for verification.


        proofPurpose (string): Purpose of the proof.


        proofValue (string): Value of the proof.


        statusUrl (string): URL to check the status of the VC.


        vcId (string): The unique identifier for the VC.


        download_url (string): URL to download the VC.


        Example Response

        {

        "vc": {

        "@context": [""],

        "id": "",

        "type": [""],

        "issuer": {

        "id": "",

        "tenantId": "",

        "communityId": ""

        },

        "issuanceDate": "",

        "expirationDate": "",

        "credentialSubject": {

        "id": "",

        "firstName": "",

        "lastName": "",

        "companyName": "",

        "companyAddress": "",

        "department": "",

        "title": "",

        "doe": "",

        "publicKey": ""

        },

        "proof": {

        "type": "",

        "created": "",

        "verificationMethod": "",

        "proofPurpose": "",

        "proofValue": ""

        },

        "statusUrl": ""

        },

        "vcId": "",

        "download_url": ""

        }'
      tags:
      - Verifiable Credentials
