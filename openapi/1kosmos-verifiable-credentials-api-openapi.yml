                    proofPurpose: assertionMethod
                    proofValue: z48SnxMwZRAsw6wPnWHHqqUYTKDPft8K55dRYxYfUyZRYHCrCEoc9vNyNzoeZGZoTRwA3iu9w2GHqex2hfmb67FRU
