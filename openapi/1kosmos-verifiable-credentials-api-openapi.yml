      operationId: verifiableCredentialsVerifyVerifiableCredential
      summary: Verify Verifiable Credential
      description: 'Verify Verifiable Credential

        This endpoint is used to verify a verifiable credential (VC) for a specific community within a tenant. It checks the authenticity and validity of the provided VC data.


        Request Format


        Method: POST


        Endpoint: {{client_api}}/vcs/tenant/:tenantID/community/:communityID/vc/verify


        Request Body: The request should include a JSON object containing the following structure:


        {

        "vc": {

        "@context": ["string"],

        "id": "string",

        "type": ["string"],

        "issuer": {

        "id": "string",

        "tenantId": "string",

        "communityId": "string"

        },

        "issuanceDate": "string (ISO 8601 date)",

        "expirationDate": "string (ISO 8601 date)",

        "credentialSubject": {

        "id": "string",

        "firstName": "string",

        "lastName": "string",

        "companyName": "string",

        "companyAddress": "string",

        "department": "string",

        "title": "string",

        "doe": "string",

        "publicKey": "string"

        },

        "proof": {

        "type": "string",

        "created": "string (ISO 8601 date)",

        "verificationMethod": "string",

        "proofPurpose": "string",

        "proofValue": "string"

        },

        "statusUrl": "string"

        }

        }


        Response Format

        The response will return a JSON object indicating whether the VC was verified and providing the status of the verification. The structure of the response is as follows:


        {

        "verified": "boolean",

        "status": {

        "subject": {

        "did": "string",

        "publicKey": "string"

        },

        "type": ["string"],

        "_id": "string",

        "vcID": "string",

        "tenantId": "string",

        "communityId": "string",

        "proof": {

        "type": "string",

        "created": "string",

        "verificationMethod": "string",

        "proofPurpose": "string",

        "proofValue": "string"

        },

        "issueTS": "integer",

        "expiryTS": "integer",

        "status": "string",

        "issuer": {

        "id": "string",

        "tenantId": "string",

        "communityId": "string"

        }

        }

        }


        Notes


        The verified field indicates the success of the verification process.


        The status object contains detailed information about the VC and its issuer.'
