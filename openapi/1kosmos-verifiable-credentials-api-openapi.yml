      operationId: verifiableCredentialsVerifyVerifiablePresentation
      summary: Verify Verifiable Presentation
      description: "Verify Verifiable Presentation\nThis endpoint is used to verify a Verifiable Presentation (VP) for a specific tenant and community. It allows clients to submit a VP and receive a verification status in return, confirming whether the VP is valid.\n\nRequest\nHTTP Method: POST\nEndpoint: {{client_api}}/vcs/tenant/:tenantID/community/:communityID/vp/verify\n\nRequest Body\nThe request body must be in JSON format and should contain the following structure:\n\n{\n  \"vp\": {\n    \"@context\": [<Array of Context URLs>],\n    \"type\": [<Array of Types>],\n    \"verifiableCredential\": [\n      {\n        \"@context\": [<Array of Context URLs>],\n        \"id\": \"<Credential ID>\",\n        \"type\": [<Array of Types>],\n        \"issuer\": {\n          \"id\": \"<Issuer ID>\",\n          \"tenantId\": \"<Tenant ID>\",\n          \"communityId\": \"<Community ID>\"\n        },\n        \"issuanceDate\": \"<Issuance Date>\",\n        \"expirationDate\": \"<Expiration Date>\",\n        \"credentialSubject\": {\n          \"firstName\": \"<First Name>\",\n          \"id\": \"<Subject ID>\",\n          \"publicKey\": \"<Public Key>\"\n        },\n        \"proof\": {\n          \"type\": \"<Proof Type>\",\n          \"created\": \"<Creation Date>\",\n          \"verificationMethod\": \"<Verification Method>\",\n          \"proofPurpose\": \"<Proof Purpose>\",\n          \"proofValue\": \"<Proof Value>\"\n        },\n        \"statusUrl\": \"<Status URL>\"\n      }\n    ],\n    \"proof\": {\n      \"type\": \"<Proof Type>\",\n      \"created\": \"<Creation Date>\",\n      \"verificationMethod\": \"<Verification Method>\",\n      \"proofPurpose\": \"<Proof Purpose>\",\n      \"proofValue\": \"<Proof Value>\"\n    }\n  }\n}\n\nResponse\nThe response will be in JSON format and will indicate the verification result along with the status of the verifiable credentials. The structure of the response is as follows:\n\n{\n  \"verified\": <Boolean>,\n  \"vc_status\": [\n    {\n      \"subject\": {\n        \"did\": \"<Subject DID>\",\n        \"publicKey\": \"<Subject Public Key>\"\n      },\n      \"type\": [<Array of Types>],\n      \"_id\": \"<Credential ID>\",\n      \"vcID\": \"<Verifiable Credential ID>\",\n      \"tenantId\": \"<Tenant ID>\",\n      \"communityId\": \"<Community ID>\",\n      \"proof\": {\n        \"type\": \"<Proof Type>\",\n        \"created\": \"<Creation Date>\",\n        \"verificationMethod\": \"<Verification Method>\",\n        \"proofPurpose\": \"<Proof Purpose>\",\n        \"proofValue\": \"<Proof Value>\"\n      },\n      \"issueTS\": <Issue Timestamp>,\n      \"expiryTS\": <Expiry Timestamp>,\n      \"status\": \"<Status>\",\n      \"issuer\": {\n        \"id\": \"<Issuer ID>\",\n        \"tenantId\": \"<Tenant ID>\",\n        \"communityId\": \"<Community ID>\"\n      }\n    }\n  ]\n}\n\nExample Responses\n\n{\"verified\": true,\"vc_status\": [ { \"subject\": { \"did\": \"\", \"publicKey\": \"\" }, \"type\": [\"\"], \"_id\": \"\", \"vcID\": \"\", \"tenantId\": \"\", \"communityId\": \"\", \"proof\": { \"type\": \"\", \"created\": \"\", \"verificationMethod\": \"\", \"proofPurpose\": \"\", \"proofValue\": \"\" }, \"issueTS\": 0, \"expiryTS\": 0, \"status\": \"\", \"issuer\": { \"id\": \"\", \"tenantId\": \"\", \"communityId\": \"\" } }]}\n\nThis endpoint is crucial for ensuring the integrity and validity of verifiable credentials within the specified tenant and community."
