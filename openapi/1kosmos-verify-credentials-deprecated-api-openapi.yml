openapi: 3.2.0
info:
  title: Admin Console API Documentation Verify Credentials…
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: Verify Credentials (deprecated)
paths:
  /api/r1/community/{communityName}/claims/user/{userdid}/claim/{type}:
    get:
      tags:
      - Verify Credentials (deprecated)
      summary: Verify Credentials
      operationId: getCredentialForuser
      parameters:
      - name: communityName
        in: path
        required: true
        schema:
          type: string
      - name: userdid
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiableCredentials'
      deprecated: true
components:
  schemas:
    VerifiableCredentials:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        userId:
          type: string
        issuerId:
          type: string
        senderId:
          type: string
        updatedBy:
          type: string
        name:
          type: string
        documents:
          type: string
        issuedDate:
          type: string
        expiryDate:
          type: string
        isRevoked:
          type: string
        updateReason:
          type: string
        stdCredData:
          type: string
          writeOnly: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
