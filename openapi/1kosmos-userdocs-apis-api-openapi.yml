components:
  schemas:
    BIDAccount:
      type: object
      properties:
        username:
          type: string
        uid:
          type: string
        authModuleId:
          type: string
        source:
          type: string
        communityId:
          type: string
        tenantId:
          type: string
        urn:
          type: string
        dguid:
          type: string
        otpSeed:
          type: string
    RequestModel:
      type: object
      properties:
        publicKey:
          type: string
        data:
          type: string
        did:
          type: string
        lon:
          type: string
        lat:
          type: string
        appid:
          type: string
        pushid:
          type: string
        ial:
          type: string
        os:
          type: string
        eventData:
          type: string
        ipfs_hash:
          type: string
        version:
          type: string
        account:
          $ref: '#/components/schemas/BIDAccount'
        userId:
          type: string
        smsTemplateId:
          type: string
        provider:
          type: string
    GetUserIALByDidsRequest:
      type: object
      properties:
        dids:
          type: array
          items:
            type: string
        urn:
          type: string
    UserDocumentsFetchRequest:
      type: object
      properties:
        metadataOnly:
          type: boolean
        categories:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        id:
          type: array
          items:
            type: string
        context:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
