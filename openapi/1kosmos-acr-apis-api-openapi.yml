openapi: 3.2.0
info:
  title: Admin Console API Documentation ACR APIs API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: ACR APIs
paths:
  /api/r1/acr/community/{community}/code:
    put:
      tags:
      - ACR APIs
      summary: Create a new access code
      operationId: createCode_1
      parameters:
      - name: community
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/r1/acr/community/{community}/{code}/redeem:
    post:
      tags:
      - ACR APIs
      summary: Redeem access code
      operationId: redeemCode
      parameters:
      - name: community
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/r1/acr/community/{community}/accesscodes:
    post:
      tags:
      - ACR APIs
      summary: Fetch list of Accesscodes
      description: Fetch accesscode list based on uids
      operationId: accesscodeList
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCodesRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/r1/acr/community/{community}/{code}:
    get:
      tags:
      - ACR APIs
      summary: Fetch access code
      operationId: code
      parameters:
      - name: fetchuser
        in: query
        required: false
        schema:
          type: boolean
      - name: community
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      tags:
      - ACR APIs
      summary: Delete an access code
      operationId: deleteRedeemedCode
      parameters:
      - name: community
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
components:
  schemas:
    BIDAccount:
      type: object
      properties:
        username:
          type: string
        uid:
          type: string
        authModuleId:
          type: string
        source:
          type: string
        communityId:
          type: string
        tenantId:
          type: string
        urn:
          type: string
        dguid:
          type: string
        otpSeed:
          type: string
    RequestModel:
      type: object
      properties:
        publicKey:
          type: string
        data:
          type: string
        did:
          type: string
        lon:
          type: string
        lat:
          type: string
        appid:
          type: string
        pushid:
          type: string
        ial:
          type: string
        os:
          type: string
        eventData:
          type: string
        ipfs_hash:
          type: string
        version:
          type: string
        account:
          $ref: '#/components/schemas/BIDAccount'
        userId:
          type: string
        smsTemplateId:
          type: string
        provider:
          type: string
    AccessCodesRequestModel:
      type: object
      description: list of uids
      properties:
        uids:
          type: array
          items:
            type: string
        usernames:
          type: array
          items:
            type: string
        type:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
