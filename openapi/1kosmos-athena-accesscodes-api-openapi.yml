openapi: 3.2.0
info:
  title: Admin Console API Documentation Athena - AccessCodes API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: Athena - AccessCodes
paths:
  /api/r2/acr/community/{community}/code:
    put:
      tags:
      - Athena - AccessCodes
      summary: Create a new Athena access code
      description: 'Send User Onboarding Invite


        - Creates a user''s onboarding invitation.

        - If the invitation has expired, a new invite will be sent to the user.

        - If the invitation is active, it will resend the invite.'
      operationId: createCode
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkCreator'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r2/acr/community/{community}/{code}/resend:
    post:
      tags:
      - Athena - AccessCodes
      summary: Resend magic link to the user
      description: 'Resends new invite for the access code


        - pre-condition: code must exist and status must be ''pending'''
      operationId: resendInvite
      parameters:
      - name: code
        in: path
        description: The uuid code
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkCreator'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r2/acr/community/{community}/{code}:
    delete:
      tags:
      - Athena - AccessCodes
      summary: Delete Athena access code
      description: 'Deletes a User Onboarding Invite


        - Delete an exisiting user onboarding invitation.

        - The status of the invitation is not relevant.'
      operationId: deleteRedeemedCode_1
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    MagicLinkCreator:
      type: object
      description: Generic Request Model- firstname,lastname & (emailTo or smsTo)  are required. emailSubject, emailTemplateB64, smsTemplateB64 are optional. Rest of the field not required
      properties:
        userId:
          type: string
        firstname:
          type: string
        email:
          type: string
        lastname:
          type: string
        createdby:
          type: string
        createdbyemail:
          type: string
        uid:
          type: string
        version:
          type: string
        authModuleId:
          type: string
        authType:
          type: string
        phoneRequired:
          type: boolean
        ttl_seconds:
          type: integer
          format: int32
        data:
          type: string
        emailTo:
          type: string
        emailTemplateB64:
          type: string
        emailSubject:
          type: string
        smsTo:
          type: string
        smsTemplateB64:
          type: string
        dns:
          type: string
        type:
          type: string
        smsTemplateId:
          type: string
        eventData:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
