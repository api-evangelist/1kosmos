openapi: 3.2.0
info:
  title: Admin Console API Documentation Alpha API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: Alpha
paths:
  /api/v3/rest/{communityname}/alpha/{alphacode}:
    post:
      tags:
      - Alpha
      summary: Create a Alpha
      operationId: alpha
      parameters:
      - name: communityname
        in: path
        required: true
        schema:
          type: string
      - name: alphacode
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Response'
components:
  schemas:
    BIDAccount:
      type: object
      properties:
        username:
          type: string
        uid:
          type: string
        authModuleId:
          type: string
        source:
          type: string
        communityId:
          type: string
        tenantId:
          type: string
        urn:
          type: string
        dguid:
          type: string
        otpSeed:
          type: string
    Response:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        sessionStatus:
          type: string
    RequestModel:
      type: object
      properties:
        publicKey:
          type: string
        data:
          type: string
        did:
          type: string
        lon:
          type: string
        lat:
          type: string
        appid:
          type: string
        pushid:
          type: string
        ial:
          type: string
        os:
          type: string
        eventData:
          type: string
        ipfs_hash:
          type: string
        version:
          type: string
        account:
          $ref: '#/components/schemas/BIDAccount'
        userId:
          type: string
        smsTemplateId:
          type: string
        provider:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
