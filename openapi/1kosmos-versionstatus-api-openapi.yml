openapi: 3.2.0
info:
  title: Admin Console API Documentation Version Status API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: VersionStatus
paths:
  /api/v3/rest/{communityname}/versionstatus:
    post:
      tags:
      - VersionStatus
      summary: Check Version Status
      operationId: versionStatus
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionStatusModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Response'
components:
  schemas:
    VersionStatusModel:
      type: object
      properties:
        device:
          type: string
    Response:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        sessionStatus:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
x-provenance:
  method: harvested
  publisher: 1Kosmos
