tags:
- name: OTP
paths:
  /api/r2/otp/verify:
    post:
      tags:
      - OTP
      summary: Verify a T/OTP code
      description: 'Verify a T/OTP


        - >.'
      operationId: verifyOTPCode_1
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '403':
          description: OTP locked for the user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '410':
          description: OTP match found, but the validity time has expired.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '404':
          description: OTP is Invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        '409':
          description: OTP already used.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r2/otp/unlock:
    post:
      tags:
      - OTP
      summary: Admin force unlock OTP
      description: 'Force unlock OTP for a user


        - >.'
      operationId: unlockOTP
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/r2/otp/generate:
    post:
      tags:
      - OTP
      summary: Request new OTP code
      description: 'Request generation of new OTP

        Requests are processed asynchronously

        This method will return a request id / messageId that can be used to track status of the request.

        - to request otp to be sent to any channel (sms, email, voice) a destination address must be provided.

        - if no destination address is provided, OTP is returned synchronously.

        - if any one destination is provided, OTP is scheduled for asnch generation / delivery.

        - new param returnOTP should be set to TRUE only if you expect otp code returned in api response.

        OTPs are meant to be delivered out-of-band. Please use this flag only if you have secured requesting client application properly.

        otpRequested: do not provide any value, this is strictly for internal use!'
      operationId: generateNewOTPCode_1
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestModel'
        required: true
      responses:
        '403':
          description: OTP locked for the user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/v3/rest/{communityname}/otpviasms:
    post:
      tags:
      - OTP
      summary: Send OTP by SMS
      operationId: otpviasms
      parameters:
      - name: communityname
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v3/rest/{communityname}/otpviaemail:
    post:
      tags:
      - OTP
      summary: Send OTP by Email,
      operationId: otpviaemail
      parameters:
      - name: communityname
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
