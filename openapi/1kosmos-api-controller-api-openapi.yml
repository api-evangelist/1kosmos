    post:
      tags:
      - api-controller
      operationId: refreshCache
      parameters:
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDetails'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Response'
      summary: Refresh cache
      x-summary-source: derived
components:
  schemas:
    RefreshDetails:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
    Response:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        sessionStatus:
          type: string
    Operation:
      type: object
      properties:
        cmd:
          type: string
        args:
          type: array
          items:
            type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
