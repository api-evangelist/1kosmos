openapi: 3.2.0
info:
  title: Admin Console API Documentation ECDS HELPER API
  description: API documentation for Admin Console
  contact:
    name: OneKosmos
    email: support@onekosmos.com
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: '1.0'
servers:
- url: https://blockid-trial.1kosmos.net
  description: Generated server url
security:
- ApiKeyAuth: []
tags:
- name: ECDS-HELPER
paths:
  /api/r1/community/{communityName}/ecdsahelper:
    post:
      tags:
      - ECDS-HELPER
      summary: Encrypt and Decrypt
      operationId: encryptDecrypt
      parameters:
      - name: communityName
        in: path
        required: true
        schema:
          type: string
      - name: publickey
        in: header
        description: Public key of the client
        required: true
        schema:
          type: string
      - name: licensekey
        in: header
        description: License key encrypted with ECDSA
        required: true
        schema:
          type: string
      - name: requestId
        in: header
        description: JSON string encrypted with ECDSA containing appid, uuid, and ts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ECDSAHelpRequestModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    ECDSAHelpRequestModel:
      type: object
      properties:
        method:
          type: string
        privateKey:
          type: string
        otherPartyPublicKey:
          type: string
        dataStr:
          type: string
        dataMap:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: licensekey
      in: header
