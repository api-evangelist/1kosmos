aid: 1kosmos
name: 1Kosmos
description: '1Kosmos is a digital identity company whose BlockID platform combines identity
  proofing, document and biometric verification, and passwordless / FIDO2 authentication into a
  single tenant-scoped platform used across workforce, customer and citizen identity. The platform
  is delivered as a REST API surface (identity verification sessions, identity assurance level
  lookup, one-time passcodes, user management, access codes, W3C Verifiable Credentials and
  Verifiable Presentations, IAL2 identity-proofing workflows and reporting/metrics) plus first-party
  helper SDKs for NodeJS, Java, PHP, .NET, .NET Core and Go, and native Android/iOS mobile SDKs.
  1Kosmos is Kantara-approved as a full-service credential service provider conformant with NIST SP
  800-63-3 at IAL2/AAL2, is FIDO2 certified, holds SOC 2 Type II and ISO 27001, and holds a FedRAMP
  High authorization.'
