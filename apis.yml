apis:
- aid: 1kosmos-blockid
  name: 1Kosmos BlockID Platform API
  description: 'The tenant-scoped REST surface of the 1Kosmos BlockID platform: identity
    verification (IDVerify) document-share sessions, identity assurance level (IAL) lookup, one-time
    passcode generation and verification, user management, access codes, W3C Verifiable Credential
    and Verifiable Presentation issuance and verification, IAL2 identity-proofing workflow
    instances, and reporting/metrics endpoints. Requests are authenticated with an ECDSA-encrypted
    license key plus the caller public key.'
